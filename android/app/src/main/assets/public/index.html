    <script>
      // Ignore Vite HMR WebSocket errors in AI Studio preview per platform environment constraints
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const first = args[0];
            const msg = (first instanceof Error ? (first.message || '') : String(first)) + (args[1] ? String(args[1]) : '');
            if (msg.includes('WebSocket closed without opened') || (msg.includes('[vite]') && (msg.includes('WebSocket') || msg.includes('websocket')))) {
              return;
            }
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = (e.reason?.message || '') + String(e.reason || '');
          if (reasonStr.includes('WebSocket closed without opened') || reasonStr.includes('vite-hmr') || reasonStr.includes('[vite]')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          const errStr = (e.message || '') + (e.error?.message || '') + (e.filename || '');
          if (errStr.includes('WebSocket closed without opened') || errStr.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
